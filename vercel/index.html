<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>作品ギャラリー</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" sizes="32x32" type="image/png">
<style>
  :root {
    --bg: #f4f4f6; --panel: #fff; --text: #222; --muted: #777; --line: #ddd; --accent: #2563eb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; background: var(--bg); color: var(--text); }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center;
  }
  header h1 { font-size: 18px; margin: 0; }
  .ctrl { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .ctrl select, .ctrl input[type=number] { font-size: 14px; padding: 4px 6px; }
  .badge { font-size: 12px; color: var(--muted); }
  #msg { margin: 60px auto; max-width: 640px; text-align: center; color: var(--muted); }

  main { padding: 16px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .card .top { display: flex; align-items: center; gap: 8px; padding: 8px 10px; font-size: 14px; border-bottom: 1px solid var(--line); }
  .card .num { font-weight: bold; color: var(--accent); flex: 1; }
  .card .top a { color: var(--muted); text-decoration: none; font-size: 12px; }
  .card .top a:hover { text-decoration: underline; }
  .card iframe { width: 100%; height: var(--h, 360px); border: 0; background: #fff; display: block; }

  #viewer { position: fixed; inset: 0; background: #111; z-index: 100; display: none; flex-direction: column; }
  #viewer.show { display: flex; }
  #viewer .bar { display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: #222; color: #eee; font-size: 14px; }
  #viewer .bar .num { flex: 1; }
  #viewer .bar button { font-size: 14px; padding: 4px 12px; cursor: pointer; }
  #viewer iframe { flex: 1; border: 0; background: #fff; }
</style>
</head>
<body>
<header>
  <h1 id="title">作品ギャラリー</h1>
  <div class="ctrl">列数
    <select id="cols"><option>1</option><option>2</option><option selected>3</option><option>4</option></select>
  </div>
  <div class="ctrl">高さ
    <input id="height" type="number" value="360" min="150" step="30" style="width:5em"> px
  </div>
  <div class="ctrl"><span class="badge" id="info"></span></div>
</header>

<div id="msg">読み込み中…</div>
<main><div class="grid" id="grid"></div></main>

<div id="viewer">
  <div class="bar">
    <button id="vPrev">← 前</button>
    <span class="num" id="vNum"></span>
    <a id="vLink" target="_blank" style="color:#9cf">別タブで開く</a>
    <button id="vNext">次 →</button>
    <button id="vClose">閉じる</button>
  </div>
  <iframe id="vFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>
</div>

<script>
const $ = s => document.querySelector(s);
let urls = [];

// /g/<id> または ?g=<id>
const id = (location.pathname.match(/^\/g\/([a-z0-9]+)/) || [])[1] || new URLSearchParams(location.search).get('g');

async function load() {
  if (!id) { $('#msg').textContent = '先生から共有されたリンクを開いてください。'; return; }
  try {
    const res = await fetch('/api/galleries?id=' + encodeURIComponent(id));
    if (res.status === 404) throw new Error('このギャラリーは見つかりません（公開が終了した可能性があります）。');
    if (!res.ok) throw new Error('読み込みに失敗しました (' + res.status + ')');
    const data = await res.json();
    urls = data.urls;
    $('#title').textContent = data.title;
    document.title = data.title;
    $('#info').textContent = urls.length + '件の作品';
    $('#msg').style.display = 'none';
    render();
  } catch (err) {
    $('#msg').textContent = err.message;
  }
}

function render() {
  const grid = $('#grid');
  grid.innerHTML = '';
  urls.forEach((url, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="top">
        <span class="num">#${i + 1}</span>
        <a href="${esc(url)}" target="_blank">別タブ</a>
        <a href="#" data-i="${i}" class="zoom">拡大</a>
      </div>
      <iframe src="${esc(url)}" loading="lazy" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>
    `;
    grid.appendChild(card);
  });
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

// ---------- 拡大表示 ----------
let cur = -1;
function openViewer(i) {
  cur = (i + urls.length) % urls.length;
  $('#vNum').textContent = '#' + (cur + 1) + ' / ' + urls.length;
  $('#vLink').href = urls[cur];
  $('#vFrame').src = urls[cur];
  $('#viewer').classList.add('show');
}
function closeViewer() { $('#viewer').classList.remove('show'); $('#vFrame').src = 'about:blank'; }

$('#grid').addEventListener('click', e => {
  const a = e.target.closest('a.zoom');
  if (a) { e.preventDefault(); openViewer(+a.dataset.i); }
});
$('#vPrev').onclick = () => openViewer(cur - 1);
$('#vNext').onclick = () => openViewer(cur + 1);
$('#vClose').onclick = closeViewer;
document.addEventListener('keydown', e => {
  if (!$('#viewer').classList.contains('show')) return;
  if (e.key === 'ArrowRight') openViewer(cur + 1);
  if (e.key === 'ArrowLeft') openViewer(cur - 1);
  if (e.key === 'Escape') closeViewer();
});
$('#cols').onchange = e => document.documentElement.style.setProperty('--cols', e.target.value);
$('#height').oninput = e => document.documentElement.style.setProperty('--h', e.target.value + 'px');

load();
</script>
</body>
</html>
